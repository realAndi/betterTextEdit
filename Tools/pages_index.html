<!DOCTYPE html>
<!--
  The landing page for the GitHub Pages site that hosts appcast.xml.

  The feed has to be served from somewhere, and a bare directory listing at the
  root of a download host is a poor thing to hand someone who followed a link.
  This is copied into place by the release workflow; it is static, so nothing
  here needs regenerating per release — the download button points at GitHub's
  "latest release" redirect, which always resolves to the newest .dmg.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>betterTextEdit</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1c1c1e;
    --muted: #6b6b70;
    --edge: #e2e2e6;
    --accent: #2f6fed;
    --accent-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131316;
      --fg: #ececf1;
      --muted: #9a9aa2;
      --edge: #2b2b31;
      --accent: #5b8dff;
      --accent-fg: #0d0d10;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12vh 24px 64px;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 34rem; }
  h1 { font-size: 2.25rem; letter-spacing: -0.02em; margin: 0 0 .4rem; }
  p.lede { color: var(--muted); margin: 0 0 2.25rem; font-size: 1.0625rem; }
  .actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-bottom: 2.5rem; }
  a.button {
    display: inline-block;
    padding: .6rem 1.15rem;
    border-radius: .55rem;
    text-decoration: none;
    font-weight: 550;
    border: 1px solid var(--edge);
    color: var(--fg);
  }
  a.button.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  footer {
    border-top: 1px solid var(--edge);
    padding-top: 1.25rem;
    color: var(--muted);
    font-size: .9375rem;
  }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .875em;
    background: color-mix(in srgb, var(--fg) 8%, transparent);
    padding: .15em .4em;
    border-radius: .3em;
  }
</style>
</head>
<body>
<main>
  <h1>betterTextEdit</h1>
  <p class="lede">A text editor for macOS. Syntax highlighting, themes, Markdown
  and rich text, all in one window.</p>

  <div class="actions">
    <a class="button primary"
       href="https://github.com/realAndi/betterTextEdit/releases/latest">Download</a>
    <a class="button"
       href="https://github.com/realAndi/betterTextEdit">Source on GitHub</a>
  </div>

  <footer>
    <p>Requires macOS 26 or later. Installed copies update themselves — this
    site also serves the <a href="appcast.xml">update feed</a> they check.</p>
  </footer>
</main>
</body>
</html>
